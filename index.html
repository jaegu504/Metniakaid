<!DOCTYPE html>
<html lang="ota" dir="rtl">
<head>

    <title id="pageTitle">متن عقائد سؤاللری</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-controls-left">
            <button id="hamburgerBtn" class="header-btn">☰</button>
            <button id="languageToggleBtn" class="header-btn">ID</button>
        </div>

        <h1 id="mainTitle">متن عقائد سؤاللری</h1>

        <button id="darkModeToggle" class="header-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sun-icon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="moon-icon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
    </header>

    <div class="container">
        <aside id="sidebar">
            <nav>
                <button class="category-btn" data-category="muqaddimat" data-lang-osmanlica="مقدمات العقائد" data-lang-indonesia="Pendahuluan Akidah">مقدمات العقائد</button>
                <button class="category-btn" data-category="ilahiyat" data-lang-osmanlica="إلهيات" data-lang-indonesia="Ilahiyat">إلهيات</button>

                <button class="category-btn" data-category="ahwal_mumkinat" data-lang-osmanlica="أحوال الممكنات" data-lang-indonesia="Ahwal al-Mumkinat">أحوال الممكنات</button>
                <button class="category-btn" data-category="all" data-lang-osmanlica="بتون سواللردن" data-lang-indonesia="Semua Soal">بتون سواللردن</button>
            </nav>
        </aside>

        <main id="mainContent">
            <div id="questionContainer">
                <p id="questionText">بر كاتغورى سچڭ ویا \"بتون سواللردن\" دوکمەسنه باصڭ.</p>
            </div>
            <div id="answerContainer" style="display: none;">
                <p id="answerText"></p>
            </div>
            <div class="controls">
                <button id="showAnswerBtn" disabled>جوابی کور</button>
                <button id="nextQuestionBtn" disabled>ایلری</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
